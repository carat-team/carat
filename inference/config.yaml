app:
  max_message_mb: 100

models:
  image:
    general_weights: weights/resnet_general92.pth
    faces_weights: weights/resnet_faces88.pth
  text:
    model_weights: weights/model_texts.safetensors
    model_name: roberta-base
  ocr:
    # EasyOCR language codes; the Dockerfile downloads models for the same languages
    languages: [ru, en]
    # Text blocks recognized with lower confidence are dropped
    min_confidence: 0.3
    # Longer image side in pixels; bigger photos are downscaled to keep CPU inference fast
    max_image_side: 1600
  segmentation:
    # rembg model name; rembg downloads it to $U2NET_HOME (~/.u2net), the Dockerfile does it at build time
    model_name: isnet-general-use
