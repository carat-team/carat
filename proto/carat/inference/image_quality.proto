syntax = "proto3";

package carat.inference;

option java_multiple_files = true;
option java_package = "io.github.carat_team.carat.grpc";
option java_outer_classname = "ImageQualityProto";

service ImageQuality {
  rpc Analyze (ImageQualityRequest) returns (ImageQualityReply);
}

message ImageQualityRequest {
  bytes image_data = 1;
}

message ImageQualityReply {
  int32 sharpness = 1;
  int32 overexposure = 2;
  int32 underexposure = 3;
  int32 resolution = 4;
  int32 overall = 5;
  string verdict = 6;
  string weakest = 7;
  int32 width = 8;
  int32 height = 9;
}
