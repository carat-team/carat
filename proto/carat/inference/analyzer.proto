syntax = "proto3";

package carat.inference;

option java_multiple_files = true;
option java_package = "io.github.carat_team.carat.grpc";
option java_outer_classname = "AnalyzerProto";

service Analyzer {
  rpc AnalyzePhoto (PhotoRequest) returns (AnalyzeReply);
  rpc AnalyzeVideo (VideoRequest) returns (AnalyzeReply);
  rpc AnalyzeText (TextRequest) returns (AnalyzeReply);
  rpc AnalyzeQuality (PhotoRequest) returns (QualityReply);
}

message PhotoRequest {
  bytes image_data = 1;
}

message VideoRequest {
  bytes video_data = 1;
}

message TextRequest {
  string text = 1;
}

message AnalyzeReply {
  string class = 1;
  float confidence = 2;
}

message QualityReply {
  int32 sharpness = 1;
  int32 overexposure = 2;
  int32 underexposure = 3;
  int32 resolution = 4;
  int32 overall = 5;
  string verdict = 6;
  string weakest = 7;
  int32 width = 8;
  int32 height = 9;
}
