name: Release

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'algorithms/**'
      - 'backend/**'
      - 'frontend/**'
      - '.dockerignore'
      - '.github/workflows/release.yml'
      - '.github/workflows/algorithms-tests.yml'
      - '.github/workflows/backend-tests.yml'

permissions:
  contents: write
  packages: write

jobs:
  algorithms-tests:
    uses: ./.github/workflows/algorithms-tests.yml

  backend-tests:
    uses: ./.github/workflows/backend-tests.yml

  build-latest:
    needs: [algorithms-tests, backend-tests]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [backend]
    steps:
      - uses: actions/checkout@v4
      - id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          push: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          tags: ghcr.io/${{ steps.owner.outputs.owner }}/carat-${{ matrix.image }}:latest

  build-release:
    needs: [algorithms-tests, backend-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [backend]
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          push: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/carat-${{ matrix.image }}:${{ steps.meta.outputs.version }}

  draft-release:
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Write release notes template
        run: |
          cat <<EOF > release-notes.md
          # Release notes

          <!-- TODO: summarize what changed in this release -->

          ## Changelog

          <!-- TODO: fill the changelog -->

          ## Installation and running

          See README.md on how to install and run the application.

          ## Docker images

          You can pull the docker images for this release using the following commands:

          \`\`\`
          docker pull ghcr.io/${{ steps.meta.outputs.owner }}/carat-backend:${{ steps.meta.outputs.version }}
          \`\`\`
          EOF
      - run: gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME - Release" --notes-file release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: [build-latest]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Signal deploy to mimosa
        env:
          DEPLOY_KEY: ${{ secrets.CARAT_DEPLOY_KEY }}
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/id_carat_deploy"
          ssh -i "$HOME/id_carat_deploy" -p 9922 \
              -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              -o IdentitiesOnly=yes \
              carat-ci@78.107.234.81 deploy
      - name: Verify
        run: |
          for i in $(seq 1 30); do
            curl -fsS https://carat.ioplock.su:8443/health && exit 0
            sleep 10
          done
          echo "health check failed" >&2
          exit 1
