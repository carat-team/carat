[project]
name = "carat-algorithms"
version = "0.1.0"
description = "Product card checks for the Chestny Znak perfumery category"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.2",
]

[project.optional-dependencies]
vision = [
    "pillow>=13.0.0",
    "zxing-cpp>=3.1.1",
]
ml = [
    "easyocr>=1.7.2",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "ANN"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test files in different directories may share a name (test_check.py)
addopts = "--import-mode=importlib"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
